name: Build apfree-wifidog for GL-MT6000

# 只编译 ipk，不编译整机固件。
# 目标：GL.iNet GL-MT6000 原厂固件（截图信息：OpenWrt 21.02-SNAPSHOT、
# target mediatek/mt7986、内核 5.4.238、aarch64_cortex-a53）。
# 编译树用与原厂同代的 hanwckf/immortalwrt-mt798x openwrt-21.02 分支，
# 该分支本身支持 mt7986 / glinet_gl-mt6000，且同为 21.02 + 内核 5.4，
# 比用官方 21.02（无 mt7986）或 23.05/24.10（ABI、fw4/nft 时代不同）
# 更接近原厂固件的 ABI。注意：这仍不是 GL.iNet 原厂源码树本身，
# 原厂树不公开等价 SDK，所以 ipk 装机前请先备份、装后先测 wifidogx
# 能否启动，不要直接 opkg upgrade 全量升级。

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x.git
  REPO_BRANCH: openwrt-21.02
  LUCI_APP_URL: https://github.com/liudf0716/luci-app-apfree-wifidog.git
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo docker image prune -af || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget cmake \
            libtool pkg-config

      - name: Clone source
        run: git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          # 打出 apfree 在当前 feed 里的版本与依赖，供日志核对：
          # 21.02 时代原厂固件走 fw3/iptables；若 feed 里已是只支持 fw4/nft
          # 的新版 apfree，这一步的输出就是第一时间发现问题的证据。
          if [ -f feeds/packages/net/apfree-wifidog/Makefile ]; then
            grep -E "PKG_VERSION|PKG_RELEASE|DEPENDS:=" feeds/packages/net/apfree-wifidog/Makefile || true
          else
            echo "WARNING: apfree-wifidog not found in feeds/packages"
            ./scripts/feeds list | grep -i apfree || true
          fi

      - name: Add luci-app-apfree-wifidog
        run: |
          cd openwrt
          # luci-app-apfree-wifidog 上游已说明要放进 feeds/luci/applications，
          # 其 Makefile 写的是 include ../../luci.mk（相对 feeds/luci 而言）。
          # 为避免 feed 索引找不到新加的包，这里走确定性更强的 package/ 路径：
          # 把 Makefile 里的相对引用改成 feeds/luci/luci.mk 的绝对引用，
          # 再放进 package/，OpenWrt 构建系统会直接扫描 package/。
          git clone --depth 1 $LUCI_APP_URL package/luci-app-apfree-wifidog
          sed -i 's|include ../../luci.mk|include $(TOPDIR)/feeds/luci/luci.mk|' \
            package/luci-app-apfree-wifidog/Makefile
          grep -E "LUCI_TITLE|LUCI_DEPENDS|include.*luci.mk" \
            package/luci-app-apfree-wifidog/Makefile
          ./scripts/feeds install apfree-wifidog || true
          ./scripts/feeds install -a || true

      - name: Load package configuration
        run: |
          cd openwrt
          # 只做包编译，不做整机镜像：目标只定到 mt7986 + gl-mt6000，
          # 其余全部交给 make defconfig 去解析依赖。
          # 设备符号形式已在该树本地核实（defconfig/mt7986-ax6000.config）：
          # CONFIG_TARGET_DEVICE_mediatek_mt7986_DEVICE_glinet_gl-mt6000=y
          cat "$GITHUB_WORKSPACE/apfree-mt6000/apfree-mt6000.config" > .config
          make defconfig
          echo "===== target ====="
          grep -E "CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)|CONFIG_TARGET_DEVICE_mediatek_mt7986_DEVICE" .config || true
          echo "===== packages ====="
          grep -E "CONFIG_PACKAGE_(apfree-wifidog|luci-app-apfree-wifidog)=" .config || true
          # 两个主包有一个没被选中就直接失败，不要静默产出空 Release。
          grep -q "^CONFIG_PACKAGE_apfree-wifidog=y" .config
          grep -q "^CONFIG_PACKAGE_luci-app-apfree-wifidog=y" .config

      - name: Build packages only
        run: |
          cd openwrt
          # 只编译这两个包及其依赖，不跑全量 make（全量会产固件镜像，
          # 耗时数小时且不是本次目标）。依赖库会随编译一并产出 ipk。
          # 关键修正（第一次构建 12 秒就挂的原因）：
          # feed 里的包在 feeds install 后落到 package/feeds/<feed>/<包名>，
          # 所以 apfree 的正确目标是 package/feeds/packages/apfree-wifidog/compile，
          # 而不是 package/apfree-wifidog/compile（后者目录根本不存在，
          # make 会在几秒内报 No rule to make target 而不是真正编译）。
          # LuCI 包是我们自己放进 package/ 的，所以它的目标保持
          # package/luci-app-apfree-wifidog/compile 不变。
          ls -ld package/feeds/packages/apfree-wifidog package/luci-app-apfree-wifidog
          make -j$(nproc) package/feeds/packages/apfree-wifidog/compile package/luci-app-apfree-wifidog/compile V=s \
            || make -j1 package/feeds/packages/apfree-wifidog/compile package/luci-app-apfree-wifidog/compile V=s
          ls -lh bin/packages/aarch64_cortex-a53/*/apfree-wifidog*.ipk \
                 bin/packages/aarch64_cortex-a53/*/luci-app-apfree-wifidog*.ipk

      - name: Collect ipk and dependencies
        run: |
          cd openwrt
          python3 "$GITHUB_WORKSPACE/apfree-mt6000/collect_ipks.py"

      - name: Publish ipk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mt6000-apfree-build-${{ github.run_number }}
          name: apfree-wifidog for GL-MT6000 (build ${{ github.run_number }})
          body: |
            apfree-wifidog + luci-app-apfree-wifidog，专为 GL.iNet GL-MT6000 原厂固件
            （OpenWrt 21.02、mediatek/mt7986、aarch64_cortex-a53）编译的 ipk。
            - `apfree-wifidog_*.ipk` — 核心程序 wifidogx
            - `luci-app-apfree-wifidog_*.ipk` — LuCI 界面
            - 其余 `*.ipk` — 本次编译一并产出的依赖库（见 PACKAGES.txt）
            - `apfree-wifidog-mt6000-ipks.zip` — 全部 ipk + 安装说明，一次下载
            - `PACKAGES.txt` — 本次 Release 里的 ipk 清单
            - `INSTALL.md` — 装机步骤
            安装前请备份路由器配置；不要 opkg upgrade 全量升级。
            注意：编译树是 hanwckf/immortalwrt-mt798x openwrt-21.02（同代 21.02），
            不是 GL.iNet 原厂源码树，装机后请先验证 wifidogx 能否启动、LuCI 菜单
            是否出现，再投入使用。
          files: |
            openwrt/output/*.ipk
            openwrt/output/*.zip
            openwrt/output/PACKAGES.txt
            openwrt/output/INSTALL.md
